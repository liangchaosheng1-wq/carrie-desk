<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FF7A59">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta name="description" content="Carrie 的工作台 - 美食、健身、英语、跨境资讯">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carrie工作台">
<title>Carrie 的工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF7A59;
  --coral-deep:#E85D3C;
  --cream:#FFF7F0;
  --cream-deep:#FBE8DA;
  --ink:#2A1810;
  --ink-soft:#5A4030;
  --gray:#9C8678;
  --line:#EFE0D2;
  --bg:#FFFBF5;
  --card:#FFFFFF;
  --gold:#E8B14A;
  --green:#52A878;
  --blue:#3F8FCB;
  --red:#E64C4C;
  --shadow:0 4px 20px rgba(232,93,60,.08);
  --shadow-lg:0 10px 40px rgba(232,93,60,.15);
  --radius:18px;
  --radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;overscroll-behavior-y:contain;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;padding:0;}
input,textarea{font-family:inherit;}

/* App shell */
.app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:88px;position:relative;box-shadow:0 0 60px rgba(0,0,0,.04);}
@media(min-width:560px){.app{box-shadow:0 0 60px rgba(0,0,0,.08);}}

/* Header */
.header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--coral) 0%,var(--coral-deep) 100%);
  color:#fff;padding:18px 20px 16px;
  box-shadow:0 4px 20px rgba(232,93,60,.25);
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.header h1{font-family:'Playfair Display',serif;font-weight:900;font-size:24px;margin:0;letter-spacing:.5px;}
.header .sub{font-size:12px;opacity:.9;margin-top:2px;}
.header .date{font-size:12px;opacity:.9;text-align:right;line-height:1.4;}
.header .date .day{font-size:18px;font-weight:700;}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-weight:900;font-size:20px;
  border:2px solid rgba(255,255,255,.4);
  flex-shrink:0;
}

/* Tabs */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;
  background:rgba(255,251,245,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:100;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;color:var(--gray);font-size:11px;font-weight:500;
  transition:color .2s;
}
.tab svg{width:22px;height:22px;transition:transform .2s;}
.tab.active{color:var(--coral);}
.tab.active svg{transform:scale(1.1) translateY(-1px);}
.tab.active span{font-weight:700;}

/* Views */
.view{display:none;padding:18px 16px 24px;animation:fade .35s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Section title */
.section-title{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 0 14px;
}
.section-title h2{font-size:19px;font-weight:700;margin:0;letter-spacing:.3px;}
.section-title .tag{font-size:11px;color:var(--coral);background:var(--cream-deep);padding:3px 10px;border-radius:99px;font-weight:500;}

/* Card */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  margin-bottom:14px;
  border:1px solid rgba(232,93,60,.06);
}

/* Video card */
.video-card{padding:0;}
.video-thumb{
  position:relative;aspect-ratio:16/9;background:var(--cream-deep);
  overflow:hidden;
}
.video-thumb img{width:100%;height:100%;object-fit:cover;}
.video-platform{
  position:absolute;top:10px;left:10px;
  padding:3px 9px;border-radius:6px;
  font-size:10px;font-weight:700;color:#fff;
  letter-spacing:.5px;
}
.platform-douyin{background:#000;}
.platform-bilibili{background:#FB7299;}
.platform-youtube{background:#FF0000;}
.video-duration{
  position:absolute;bottom:8px;right:8px;
  background:rgba(0,0,0,.75);color:#fff;font-size:11px;
  padding:2px 6px;border-radius:4px;font-weight:500;
}
.video-views{
  position:absolute;bottom:8px;left:10px;color:#fff;font-size:11px;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.video-info{padding:13px 14px 14px;}
.video-info .title{font-weight:600;font-size:14px;line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.video-info .author{font-size:12px;color:var(--gray);margin-bottom:10px;}
.video-info .author .dot{margin:0 5px;color:var(--line);}

.recreate-badge{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#FFF6E8,#FFEACC);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  margin-top:8px;
}
.recreate-score{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:46px;
}
.recreate-score .num{font-family:'Playfair Display',serif;font-weight:900;font-size:24px;line-height:1;color:var(--gold);}
.recreate-score .label{font-size:9px;color:var(--ink-soft);margin-top:2px;}
.recreate-tags{flex:1;display:flex;flex-wrap:wrap;gap:5px;}
.tag-mini{font-size:10px;padding:2px 7px;border-radius:4px;background:#fff;color:var(--ink-soft);border:1px solid var(--line);}

.video-actions{display:flex;gap:8px;margin-top:10px;}
.video-actions a{
  flex:1;text-align:center;padding:8px;border-radius:8px;
  font-size:12px;font-weight:600;
  background:var(--cream);color:var(--ink-soft);
  transition:all .2s;
}
.video-actions a.primary{background:var(--coral);color:#fff;}
.video-actions a:active{transform:scale(.97);}

/* Filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:14px;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  white-space:nowrap;padding:7px 14px;border-radius:99px;
  background:var(--card);font-size:13px;font-weight:500;color:var(--ink-soft);
  border:1px solid var(--line);
  transition:all .2s;
}
.chip.active{background:var(--coral);color:#fff;border-color:var(--coral);}

/* Fitness */
.fit-day{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#FFF1E5,#FFE4D1);
  border-radius:var(--radius);
  padding:14px 18px;margin-bottom:16px;
  border:1px solid rgba(232,93,60,.15);
}
.fit-day .label{font-size:12px;color:var(--ink-soft);}
.fit-day .focus{font-size:20px;font-weight:700;margin-top:2px;}
.fit-day .focus-en{font-size:11px;color:var(--coral-deep);margin-top:2px;font-weight:500;}
.fit-day .time{font-size:11px;color:var(--ink-soft);text-align:right;}
.fit-day .time strong{display:block;font-size:14px;color:var(--coral);font-weight:700;}

.fit-cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.fit-cycle-item{
  background:var(--card);border-radius:var(--radius-sm);
  padding:10px 6px;text-align:center;
  border:1px solid var(--line);
  position:relative;
}
.fit-cycle-item .num{font-size:10px;color:var(--gray);font-weight:500;}
.fit-cycle-item .name{font-size:12px;font-weight:600;margin-top:2px;}
.fit-cycle-item.today{
  background:linear-gradient(135deg,var(--coral),var(--coral-deep));
  color:#fff;border-color:transparent;
}
.fit-cycle-item.today .num,.fit-cycle-item.today .name{color:#fff;}
.fit-cycle-item.today .name{font-weight:700;}
.fit-cycle-item .check{position:absolute;top:4px;right:4px;width:14px;height:14px;color:var(--green);}

.exercise{
  background:var(--card);border-radius:var(--radius-sm);
  padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);
}
.exercise .idx{
  width:30px;height:30px;border-radius:8px;
  background:var(--cream);color:var(--coral);
  font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.exercise .info{flex:1;}
.exercise .info .name{font-weight:600;font-size:14px;}
.exercise .info .detail{font-size:11px;color:var(--gray);margin-top:2px;}
.exercise .info .tips{font-size:11px;color:var(--coral);margin-top:3px;}
.exercise .check-btn{
  width:28px;height:28px;border-radius:50%;
  border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;
}
.exercise .check-btn svg{width:14px;height:14px;color:#fff;}
.exercise.done{opacity:.65;}
.exercise.done .check-btn{background:var(--green);border-color:var(--green);}
.exercise.done .name{text-decoration:line-through;color:var(--gray);}

.fit-tip{
  background:linear-gradient(135deg,#FFF6E8,#FFEACC);
  border-radius:var(--radius);padding:14px 16px;
  font-size:12px;color:var(--ink-soft);line-height:1.6;
  border-left:3px solid var(--gold);
}
.fit-tip strong{color:var(--coral);}

/* English - TED 逐句精读 */
.ted-article{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.ted-header{
  background:linear-gradient(135deg,var(--coral),var(--coral-deep));
  color:#fff;padding:22px 18px 18px;position:relative;
}
.ted-header .ted-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;opacity:.8;font-weight:600;}
.ted-header h3{margin:6px 0 4px;font-size:20px;font-weight:900;line-height:1.3;font-family:'Playfair Display',serif;}
.ted-header .ted-speaker{font-size:13px;opacity:.9;display:flex;align-items:center;gap:6px;}
.ted-header .ted-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.ted-header .ted-badge{font-size:10px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.2);font-weight:600;}
.ted-controls{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:var(--cream);
  border-bottom:1px solid var(--line);
}
.ted-controls .ctrl-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:8px;border-radius:8px;font-size:12px;font-weight:600;
  border:none;cursor:pointer;transition:all .2s;
}
.ted-play-all{background:var(--coral);color:#fff;}
.ted-play-all.playing{background:var(--ink);}
.ted-prev-btn{background:#fff;color:var(--ink-soft);border:1px solid var(--line)!important;flex:0 0 40px;}
.ted-next-btn{background:#fff;color:var(--ink-soft);border:1px solid var(--line)!important;flex:0 0 40px;}
.ted-sentences{padding:8px 0;}
.ted-sentence{
  padding:14px 18px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .25s;position:relative;
}
.ted-sentence:last-child{border-bottom:none;}
.ted-sentence.active{background:linear-gradient(90deg,rgba(255,122,89,.08),transparent);}
.ted-sentence.active::before{
  content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;
  background:var(--coral);border-radius:0 3px 3px 0;
}
.ted-sent-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.ted-sent-num{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:var(--cream-deep);color:var(--coral);
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  margin-top:2px;
}
.ted-sentence.active .ted-sent-num{background:var(--coral);color:#fff;}
.ted-sent-en{
  flex:1;font-size:16px;line-height:1.55;font-weight:500;
  color:var(--ink);font-family:'Playfair Display',serif;
}
.ted-sent-zh{
  font-size:13px;color:var(--ink-soft);line-height:1.6;
  padding-left:32px;opacity:0;max-height:0;overflow:hidden;
  transition:all .3s ease;
}
.ted-sentence.show-zh .ted-sent-zh{opacity:1;max-height:100px;padding-top:4px;}
.ted-sent-actions{
  display:flex;gap:12px;padding-left:32px;margin-top:8px;
}
.ted-sent-actions button{
  font-size:11px;color:var(--gray);display:flex;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;padding:0;font-family:inherit;
}
.ted-sent-actions button:active{color:var(--coral);}
.ted-sent-actions .playing-icon{color:var(--coral);font-weight:600;}
.ted-footer{
  padding:14px 18px;background:var(--cream);
  display:flex;justify-content:space-between;align-items:center;
}
.ted-footer .ted-hint{font-size:11px;color:var(--gray);}
.ted-switch-btn{
  font-size:12px;font-weight:600;color:var(--coral);
  background:none;border:none;cursor:pointer;padding:6px 14px;
  border-radius:99px;border:1px solid var(--coral)!important;
}
.ted-progress{
  height:3px;background:var(--line);position:relative;overflow:hidden;
}
.ted-progress-bar{
  height:100%;background:var(--coral);width:0%;
  transition:width .3s ease;
}

.read-controls{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:var(--cream);
  border-top:1px solid var(--line);
}
.read-controls button{
  flex:1;padding:8px;border-radius:8px;
  background:#fff;color:var(--ink-soft);
  font-size:12px;font-weight:600;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.read-controls button.primary{background:var(--coral);color:#fff;border-color:var(--coral);}
.read-controls button svg{width:13px;height:13px;}
.read-status{font-size:11px;color:var(--gray);min-width:60px;text-align:right;}

/* News */
.news-card{padding:14px;}
.news-card .source{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;color:#fff;
  padding:2px 8px;border-radius:4px;margin-bottom:8px;
}
.src-amazon{background:#FF9900;}
.src-tiktok{background:#000;}
.src-shopee{background:#EE4D2D;}
.src-temu{background:#FB7113;}
.src-shein{background:#000;}
.src-walmart{background:#0071CE;}
.src-policy{background:var(--green);}
.src-trend{background:var(--blue);}
.news-card .title{font-weight:700;font-size:15px;line-height:1.45;margin-bottom:6px;}
.news-card .summary{font-size:12px;color:var(--ink-soft);line-height:1.6;margin-bottom:8px;}
.news-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--gray);}
.news-card .meta .time{display:flex;align-items:center;gap:3px;}
.news-card .meta .impact{font-weight:600;}
.impact-high{color:var(--red);}
.impact-mid{color:var(--gold);}
.impact-low{color:var(--green);}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:rgba(42,24,16,.95);color:#fff;
  padding:10px 18px;border-radius:99px;
  font-size:13px;z-index:999;
  transition:transform .3s;backdrop-filter:blur(10px);
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--gray);font-size:13px;}

/* Scrollbar */
::-webkit-scrollbar{width:0;height:0;}

</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-row">
      <div class="avatar">C</div>
      <div style="flex:1">
        <h1>Carrie 的工作台</h1>
        <div class="sub" id="greeting">早上好，今天也要闪闪发光 ✨</div>
      </div>
      <div class="date" id="dateBox"></div>
    </div>
  </header>

  <!-- View: 美食视频 -->
  <section class="view active" id="view-food">
    <div class="section-title">
      <h2>美食 · 烘焙灵感</h2>
      <span class="tag" id="foodCount">12 条推荐</span>
    </div>
    <div class="chips" id="foodChips">
      <button class="chip active" data-cat="all">全部</button>
      <button class="chip" data-cat="douyin">抖音</button>
      <button class="chip" data-cat="bilibili">B站</button>
      <button class="chip" data-cat="youtube">YouTube</button>
      <button class="chip" data-cat="food">美食</button>
      <button class="chip" data-cat="baking">烘焙</button>
    </div>
    <div id="videoList"></div>
    <div class="fit-tip" style="margin-top:6px">
      <strong>二创评分</strong> 综合考虑：画面清晰度、原创度、内容结构、素材易获取性。分数 ≥ 80 推荐二创。
    </div>
  </section>

  <!-- View: 健身 -->
  <section class="view" id="view-fit">
    <div class="section-title">
      <h2>每日健身</h2>
      <span class="tag" id="fitProgress">0 / 0</span>
    </div>
    <div class="fit-day" id="todayFit"></div>
    <div class="fit-cycle" id="fitCycle"></div>
    <div id="exerciseList"></div>
    <div class="fit-tip" id="fitTip"></div>
  </section>

  <!-- View: 英语 -->
  <section class="view" id="view-eng">
    <div class="section-title">
      <h2>每日 TED 精读</h2>
      <span class="tag" id="tedDateTag">逐句跟读</span>
    </div>
    <div id="tedContainer"></div>
  </section>

  <!-- View: 跨境要闻 -->
  <section class="view" id="view-news">
    <div class="section-title">
      <h2>跨境每日要闻</h2>
      <span class="tag" id="newsDate"></span>
    </div>
    <div id="newsList"></div>
  </section>

  <!-- Tabbar -->
  <nav class="tabbar">
    <button class="tab active" data-view="food">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
      <span>美食</span>
    </button>
    <button class="tab" data-view="fit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16"/><path d="M18 4v16"/><path d="M6 8h12"/><path d="M6 16h12"/></svg>
      <span>健身</span>
    </button>
    <button class="tab" data-view="eng">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>英语</span>
    </button>
    <button class="tab" data-view="news">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6z"/></svg>
      <span>跨境</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<audio id="audio-player" preload="none"></audio>

<script>
/* ============== 数据 ============== */

// 美食/烘焙视频数据（真实B站BV号 + Deep Link）
const videos = [
  // === B站 美食 ===

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2000);
}

// 日期与问候
function renderHeader(){
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'][d.getDay()];
  const month = d.getMonth()+1, day = d.getDate();
  $('#dateBox').innerHTML = `<div class="day">${day}</div><div>${month}月 · 周${week}</div>`;
  const h = d.getHours();
  let g = '夜深了,早点休息';
  if(h>=5 && h<11) g='早上好,运动起来 ✨';
  else if(h>=11 && h<13) g='午安,补充能量 🍱';
  else if(h>=13 && h<18) g='下午好,继续冲 💪';
  else if(h>=18 && h<22) g='晚上好,放松一下 🌙';
  $('#greeting').textContent = g;
}

// 健身
function getTodayInCycle(){
  // 周一开始循环: 周一肩背, 周二胸, 周三臀腿, 周四爬坡, 周五肩背...
  const d = new Date();
  const day = d.getDay(); // 0=周日
  // 映射: 周日=爬坡(4), 周一=肩背(1), 周二=胸(2), 周三=臀腿(3), 周四=爬坡(4), 周五=肩背(1), 周六=胸(2)
  const map = [4,1,2,3,4,1,2];
  return map[day];
}
let fitDone = JSON.parse(localStorage.getItem('carrie_fit_done') || '{}');
function saveFitDone(){ localStorage.setItem('carrie_fit_done', JSON.stringify(fitDone)); }
function getTodayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

function renderFitness(){
  const todayIdx = getTodayInCycle();
  const today = fitCycle[todayIdx-1];
  const exs = fitExercises[todayIdx];
  const todayKey = getTodayKey();
  if(!fitDone[todayKey]) fitDone[todayKey] = [];

  $('#todayFit').innerHTML = `
    <div>
      <div class="label">今日训练 · 第 ${todayIdx} 天</div>
      <div class="focus">${today.focus}</div>
      <div class="focus-en">${today.name} · ${today.en}</div>
    </div>
    <div class="time">
      <strong>上午</strong>
      建议完成
    </div>
  `;

  $('#fitCycle').innerHTML = fitCycle.map((c,i)=>{
    const isToday = (i+1)===todayIdx;
    return `<div class="fit-cycle-item ${isToday?'today':''}">
      <div class="num">D${i+1}</div>
      <div class="name">${c.name}</div>
    </div>`;
  }).join('');

  $('#exerciseList').innerHTML = exs.map((e,i)=>{
    const done = fitDone[todayKey].includes(i);
    return `<div class="exercise ${done?'done':''}" data-idx="${i}">
      <div class="idx">${i+1}</div>
      <div class="info">
        <div class="name">${e.n}</div>
        <div class="detail">${e.d} · ${e.w}</div>
        <div class="tips">💡 ${e.t}</div>
      </div>
      <button class="check-btn" data-check="${i}">
        ${done?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}
      </button>
    </div>`;
  }).join('');

  $('#fitTip').innerHTML = fitTips[todayIdx];
  const doneCount = fitDone[todayKey].length;
  $('#fitProgress').textContent = `${doneCount} / ${exs.length}`;

  // 绑定勾选
  $$('#exerciseList .check-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.dataset.check;
      const arr = fitDone[todayKey];
      const pos = arr.indexOf(idx);
      if(pos>=0) arr.splice(pos,1);
      else arr.push(idx);
      saveFitDone();
      renderFitness();
      if(arr.length===exs.length) toast('🎉 今日训练全部完成!干得漂亮');
    });
  });
}

// 切换文章
function tedSwitch(dir){
  tedIdx = (tedIdx + dir + tedArticles.length) % tedArticles.length;
  tedSentIdx = -1;
  tedPlaying = false;
  const p = document.getElementById('audio-player');
  if(p){ p.pause(); p.src = ''; }
  renderEnglish();
  toast(dir > 0 ? '下一篇 TED ✨' : '上一篇 TED');
}

// 点击句子区域（非按钮）: 播放这句
function tedClickSentence(i){
  tedPlayOne(i);
}

// 播放单句
function tedPlayOne(i){
  const a = getTedArticle();
  if(i < 0 || i >= a.sentences.length) return;

  // 清除之前的高亮
  document.querySelectorAll('.ted-sentence').forEach(el => el.classList.remove('active'));
  const sentEl = document.getElementById('ted-sent-' + i);
  if(sentEl) sentEl.classList.add('active');

  tedSentIdx = i;
  updateTedProgress(i, a.sentences.length);

  // 更新播放标签
  document.querySelectorAll('[id^="ted-play-label-"]').forEach(el => {
    el.textContent = '朗读';
  });
  const label = document.getElementById('ted-play-label-' + i);
  if(label) label.textContent = '▶ 播放中';

  const audioSrc = `audio/ted/${a.id}_${i}.mp3`;
  const p = document.getElementById('audio-player');

  // 如果正在连续播放，标记
  if(!tedPlaying){
    // 单句播放模式
    p.onended = () => {
      if(sentEl) sentEl.classList.remove('active');
      if(label) label.textContent = '朗读';
    };
  }

  p.src = audioSrc;
  p.play().catch(err => {
    console.error('Audio play failed:', err);
    toast('音频加载中，请稍候重试');
  });

  // 滚动到当前句子
  if(sentEl){
    setTimeout(() => {
      sentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  }
}

// 连续播放全文
function tedPlayAll(){
  const a = getTedArticle();
  if(tedPlaying){
    // 停止
    tedPlaying = false;
    const p = document.getElementById('audio-player');
    p.pause();
    const btn = document.getElementById('tedPlayAll');
    const lbl = document.getElementById('tedPlayAllLabel');
    if(btn){ btn.classList.remove('playing'); }
    if(lbl){ lbl.textContent = '连续朗读全文'; }
    document.querySelectorAll('.ted-sentence').forEach(el => el.classList.remove('active'));
    return;
  }

  // 开始连续播放
  tedPlaying = true;
  const btn = document.getElementById('tedPlayAll');
  const lbl = document.getElementById('tedPlayAllLabel');
  if(btn){ btn.classList.add('playing'); btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg><span id="tedPlayAllLabel">停止朗读</span>'; }

  const p = document.getElementById('audio-player');
  let currentSent = 0;

  const playNext = () => {
    if(!tedPlaying || currentSent >= a.sentences.length){
      tedPlaying = false;
      if(btn){ btn.classList.remove('playing'); btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span id="tedPlayAllLabel">连续朗读全文</span>'; }
      document.querySelectorAll('.ted-sentence').forEach(el => el.classList.remove('active'));
      tedSentIdx = -1;
      updateTedProgress(0, a.sentences.length);
      return;
    }

    // 高亮当前句
    document.querySelectorAll('.ted-sentence').forEach(el => el.classList.remove('active'));
    const sentEl = document.getElementById('ted-sent-' + currentSent);
    if(sentEl){
      sentEl.classList.add('active');
      sentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    tedSentIdx = currentSent;
    updateTedProgress(currentSent, a.sentences.length);

    // 播放音频
    p.src = `audio/ted/${a.id}_${currentSent}.mp3`;
    p.onended = () => {
      currentSent++;
      setTimeout(playNext, 400); // 句子间停顿400ms
    };
    p.play().catch(err => {
      console.error('Play failed:', err);
      currentSent++;
      setTimeout(playNext, 400);
    });
  };

  playNext();
}

// 更新进度条
function updateTedProgress(current, total){
  const bar = document.getElementById('tedProgressBar');
  if(bar){
    const pct = total > 0 ? ((current + 1) / total) * 100 : 0;
    bar.style.width = pct + '%';
  }
}

// 切换中文显示
function tedToggleZh(i){
  const sentEl = document.getElementById('ted-sent-' + i);
  const label = document.getElementById('ted-zh-label-' + i);
  if(!sentEl) return;
  if(sentEl.classList.contains('show-zh')){
    sentEl.classList.remove('show-zh');
    if(label) label.textContent = '中文';
  } else {
    sentEl.classList.add('show-zh');
    if(label) label.textContent = '收起';
  }
}

// Web Speech (浏览器) / Android TTS (App内)
function speak(text, lang='en-US', rate=0.9){
  // 在 Carrie App 内使用原生 TTS
  if (window.CarrieApp && window.CarrieApp.speak) {
    try {
      window.CarrieApp.speak(text);
      return;
    } catch (e) {
      console.warn('App TTS failed', e);
    }
  }
  if(!('speechSynthesis' in window)){
    toast('浏览器不支持语音朗读');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = rate;
  u.pitch = 1;
  window.speechSynthesis.speak(u);
}

function isInCarrieApp(){
  return window.CarrieApp && window.CarrieApp.isApp && window.CarrieApp.isApp();
}

// 播放本地音频文件
function playAudio(playerId, src){
  const p = document.getElementById(playerId);
  if(!p){ toast('播放器未就绪'); return; }
  p.src = src;
  p.play().catch(err => {
    console.error(err);
    toast('播放失败,请重试');
  });
}

function openExternal(url){
  if (isInCarrieApp()) {
    if (window.CarrieApp.openUrl) {
      try { window.CarrieApp.openUrl(url); return; } catch(e){}
    }
    window.location.href = url;
  } else {
    window.open(url, '_blank');
  }
}

// 打开视频：优先尝试 Deep Link 唤起 App，失败则用网页版
function openVideo(appUrl, webUrl){
  const fallback = webUrl || appUrl;
  if(!appUrl){
    openExternal(fallback);
    return;
  }
  if (isInCarrieApp()) {
    // 在 APK 内：通过 openUrl 让 Android 尝试唤起 App
    if (window.CarrieApp.openUrl) {
      try { window.CarrieApp.openUrl(appUrl); return; } catch(e){}
    }
    // 降级到网页版
    window.location.href = fallback;
  } else {
    // 在浏览器内：尝试用 iframe 触发 Deep Link
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = appUrl;
    document.body.appendChild(iframe);
    // 1.5秒后如果还在当前页，说明App没安装，跳转网页版
    setTimeout(() => {
      document.body.removeChild(iframe);
      window.open(fallback, '_blank');
    }, 1500);
  }
}
